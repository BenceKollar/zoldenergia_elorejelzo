name: Automatikus Adatfrissítés

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Budapest'
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Csomagok telepítése
        run: pip install -r requirements.txt

      - name: Adatgyűjtés futtatása
        run: python data_collector.py

      - name: Frissítési időpont rögzítése
        run: date -u '+%Y-%m-%d %H:%M:%S UTC' > last_run.txt

      - name: Frissített adatok feltöltése
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatikus adatfrissítés"
          file_pattern: 'energy_data.db last_run.txt'
